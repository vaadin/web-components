name: Preview

# Publishes preview builds of all public packages to pkg.pr.new for a pull
# request labeled `preview`, and again for every commit pushed while the label
# is there. The pkg.pr.new bot comments the install URLs on the pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish preview
    # A `labeled` event for another label must not start a build of its own.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview')
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn --frozen-lockfile --no-progress --non-interactive

      - name: Build
        run: yarn release

      - name: Check React package integrity
        run: node react/scripts/check-package.js

      # A single call publishes every package, so that pkg.pr.new rewrites
      # their cross-package dependencies to the URLs of the same commit.
      # Private packages are skipped.
      #
      # --no-compact keeps the URLs in one form, with the full commit hash,
      # which is the form the cross-package dependencies use. Consumers such as
      # a flow-components snapshot must reference that exact URL, or npm
      # installs a second copy of the package.
      - name: Publish
        run: yarn pkg-pr-new publish './packages/*' --no-compact --commentWithSha --packageManager=npm,yarn
