name: PR Presentation

# Builds a slide deck that explains a pull request from its code and links the
# deck from one comment on the PR. Triggered automatically when a feature or
# bugfix PR is opened or marked ready for review (eligibility rules on the job
# condition), or on request by adding the "pr-presentation" label to any PR.
# The deck itself is built by the shared vaadin/github-actions/pr-presentation
# action; this workflow owns the triggers and eligibility rules.

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
    branches: [main]

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  check:
    # Eligibility is a cheap `if` pre-filter plus an authoritative org-membership
    # check in the job. The label trigger only checks who added the label: only
    # users with triage access can add labels, and the job checks that user's
    # org membership. Auto triggers (opened, ready for review) additionally skip
    # drafts, known bots, and PRs whose title is not a feat or fix. The
    # pre-filter allows CONTRIBUTOR because on pull_request events the
    # author_association of a private org member is reported as CONTRIBUTOR;
    # the org-membership API call in the job is what actually confirms access.
    if: |
      (github.event.action == 'labeled' &&
       github.event.label.name == 'pr-presentation') ||
      (contains(fromJSON('["opened", "ready_for_review"]'), github.event.action) &&
       github.event.pull_request.draft == false &&
       !contains(fromJSON('["dependabot[bot]", "vaadin-bot"]'), github.event.pull_request.user.login) &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.pull_request.author_association) &&
       (startsWith(github.event.pull_request.title, 'feat:') ||
        startsWith(github.event.pull_request.title, 'feat(') ||
        startsWith(github.event.pull_request.title, 'feat!') ||
        startsWith(github.event.pull_request.title, 'fix:') ||
        startsWith(github.event.pull_request.title, 'fix(') ||
        startsWith(github.event.pull_request.title, 'fix!')))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.access.outputs.eligible }}
    steps:
      - name: Check org membership
        id: access
        env:
          GH_TOKEN: ${{ secrets.VAADIN_BOT_TOKEN || github.token }}
          # The PR author for auto triggers, the user who added the label for
          # the label trigger.
          REQUESTER: ${{ github.event.sender.login }}
        run: |
          if gh api "orgs/${{ github.repository_owner }}/members/$REQUESTER" --silent; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

  present:
    needs: check
    if: needs.check.outputs.eligible == 'true'
    # One deck per PR at a time; a re-trigger queues instead of aborting a run
    # that may be mid-posting. Group is enforced on the job level instead of the
    # workflow, so that a run whose check condition fails does not cancel a
    # queued run whose condition passes.
    concurrency:
      group: pr-presentation-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The action computes the merge base in the checkout, so it needs the
      # full history.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build the presentation
        uses: vaadin/github-actions/pr-presentation@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr-number: ${{ env.PR_NUMBER }}
          comment-token: ${{ secrets.VAADIN_BOT_TOKEN }}
