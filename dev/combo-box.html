<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Combo Box</title>
    <script type="module" src="./common.js"></script>
  </head>
  <body>
    <vaadin-combo-box id="country" label="Country"></vaadin-combo-box>
    <vaadin-combo-box id="appointment" label="Appointment time" item-disabled-path="booked"></vaadin-combo-box>

    <script type="module">
      import '@vaadin/combo-box';

      const comboBox = document.querySelector('#country');

      comboBox.dataProvider = async (params, callback) => {
        const index = params.page * params.pageSize;
        const response = await fetch(
          `https://demo.vaadin.com/demo-data/1.0/filtered-countries?index=${index}&count=${params.pageSize}&filter=${params.filter}`,
        );
        if (response.ok) {
          const { result, size } = await response.json();
          // Emulate network latency for demo purpose
          setTimeout(() => {
            callback(result, size);
          }, 100);
        }
      };

      document.querySelector('#appointment').items = [
        { label: '9:00', value: '09:00' },
        { label: '10:00 (fully booked)', value: '10:00', booked: true },
        { label: '11:00', value: '11:00' },
      ];
    </script>
  </body>
</html>
