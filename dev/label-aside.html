<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fields: label-aside theme variant</title>
    <script type="module" src="./common.js"></script>

    <style>
      h2 {
        margin-top: 2em;
        margin-bottom: 0.5em;

        &:first-child {
          margin-top: 0;
        }
      }

      .frame {
        display: flex;
        flex-direction: column;
        gap: 1em;
        border: 1px dashed gray;
        padding: 1em;
        max-width: 40em;
        resize: horizontal;
        overflow: hidden;
      }

      .custom-label-width {
        --vaadin-field-label-width: 12em;
        --vaadin-field-label-spacing: 2em;
      }
    </style>
  </head>

  <body>
    <h2>Fields with label-aside</h2>
    <div class="frame">
      <vaadin-text-field
        theme="label-aside"
        label="First name"
        helper-text="As shown in your passport"
      ></vaadin-text-field>
      <vaadin-text-field
        theme="label-aside"
        label="A very long label that wraps onto multiple lines"
      ></vaadin-text-field>
      <vaadin-email-field
        theme="label-aside"
        label="Email"
        required
        invalid
        error-message="Email is required"
        helper-text="We never share your email"
      ></vaadin-email-field>
      <vaadin-password-field
        theme="label-aside helper-above-field"
        label="Password"
        helper-text="At least 8 characters"
      ></vaadin-password-field>
      <vaadin-number-field theme="label-aside" label="Weight" helper-text="In kilograms"></vaadin-number-field>
      <vaadin-integer-field theme="label-aside" label="Age" step-buttons-visible></vaadin-integer-field>
      <vaadin-text-area
        theme="label-aside"
        label="Shipping address"
        required
        invalid
        error-message="Address is required"
        helper-text="Street, building, apartment"
      ></vaadin-text-area>
      <vaadin-select theme="label-aside" label="Country" helper-text="Where you live"></vaadin-select>
      <vaadin-combo-box theme="label-aside" label="City"></vaadin-combo-box>
      <vaadin-multi-select-combo-box
        theme="label-aside"
        label="Skills"
        helper-text="Pick a few"
      ></vaadin-multi-select-combo-box>
      <vaadin-date-picker theme="label-aside" label="Birth date"></vaadin-date-picker>
      <vaadin-time-picker theme="label-aside" label="Preferred time"></vaadin-time-picker>
      <vaadin-date-time-picker theme="label-aside" label="Appointment"></vaadin-date-time-picker>
      <vaadin-custom-field theme="label-aside" label="Enrollment period" helper-text="First and last day">
        <vaadin-text-field placeholder="From"></vaadin-text-field>
        <vaadin-text-field placeholder="To"></vaadin-text-field>
      </vaadin-custom-field>
      <vaadin-slider theme="label-aside" label="Volume"></vaadin-slider>
      <vaadin-slider theme="label-aside" label="Brightness" min-max-visible></vaadin-slider>
      <vaadin-range-slider theme="label-aside" label="Price range"></vaadin-range-slider>
      <vaadin-radio-group theme="label-aside" label="Language" helper-text="Preferred language">
        <vaadin-radio-button label="English" value="en"></vaadin-radio-button>
        <vaadin-radio-button label="Finnish" value="fi"></vaadin-radio-button>
      </vaadin-radio-group>
      <vaadin-checkbox-group theme="label-aside" label="Notifications" helper-text="Choose at least one channel">
        <vaadin-checkbox label="Email" value="email"></vaadin-checkbox>
        <vaadin-checkbox label="SMS" value="sms"></vaadin-checkbox>
      </vaadin-checkbox-group>
    </div>

    <h2>Field states</h2>
    <div class="frame">
      <vaadin-text-field theme="label-aside" label="Read-only" readonly value="Value"></vaadin-text-field>
      <vaadin-text-field theme="label-aside" label="Disabled" disabled value="Value"></vaadin-text-field>
      <vaadin-text-field theme="label-aside" placeholder="No label"></vaadin-text-field>
    </div>

    <h2>Custom label width and spacing</h2>
    <div class="frame custom-label-width">
      <vaadin-text-field theme="label-aside" label="First name"></vaadin-text-field>
      <vaadin-date-picker theme="label-aside" label="Birth date"></vaadin-date-picker>
      <vaadin-slider theme="label-aside" label="Volume"></vaadin-slider>
    </div>

    <h2>Checkables (variant must have no effect)</h2>
    <div class="frame">
      <vaadin-checkbox theme="label-aside" label="Accept terms" helper-text="See the terms"></vaadin-checkbox>
      <vaadin-checkbox label="Accept terms" helper-text="See the terms"></vaadin-checkbox>
      <vaadin-radio-button theme="label-aside" label="English" value="en"></vaadin-radio-button>
      <vaadin-radio-button label="English" value="en"></vaadin-radio-button>
      <vaadin-switch theme="label-aside" label="Enable notifications"></vaadin-switch>
      <vaadin-switch label="Enable notifications"></vaadin-switch>
    </div>

    <script type="module">
      // Enable feature flag for the experimental vaadin-switch component
      window.Vaadin ||= {};
      window.Vaadin.featureFlags ||= {};
      window.Vaadin.featureFlags.switchComponent = true;

      import '@vaadin/checkbox';
      import '@vaadin/checkbox-group';
      import '@vaadin/combo-box';
      import '@vaadin/custom-field';
      import '@vaadin/date-picker';
      import '@vaadin/date-time-picker';
      import '@vaadin/email-field';
      import '@vaadin/integer-field';
      import '@vaadin/multi-select-combo-box';
      import '@vaadin/number-field';
      import '@vaadin/password-field';
      import '@vaadin/radio-group';
      import '@vaadin/select';
      import '@vaadin/slider';
      import '@vaadin/slider/vaadin-range-slider.js';
      import '@vaadin/switch';
      import '@vaadin/text-area';
      import '@vaadin/text-field';
      import '@vaadin/time-picker';

      document.querySelector('vaadin-select').items = [
        { label: 'Finland', value: 'fi' },
        { label: 'Germany', value: 'de' },
      ];

      document.querySelector('vaadin-combo-box').items = ['Helsinki', 'Turku', 'Tampere'];

      const multiSelect = document.querySelector('vaadin-multi-select-combo-box');
      multiSelect.items = ['CSS', 'HTML', 'JavaScript'];
      multiSelect.selectedItems = ['CSS', 'HTML'];
    </script>
  </body>
</html>
