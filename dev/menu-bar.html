<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu bar</title>
    <script type="module" src="./common.js"></script>
    <script type="module">
      window.Vaadin ??= {};
      window.Vaadin.featureFlags ??= {};
      window.Vaadin.featureFlags.accessibleDisabledMenuItems = true;
    </script>
  </head>

  <body>
    <vaadin-menu-bar>
      <vaadin-tooltip slot="tooltip" hover-delay="500" hide-delay="500"></vaadin-tooltip>
    </vaadin-menu-bar>

    <h2>Split layout</h2>

    <vaadin-split-layout>
      <div><vaadin-menu-bar id="split-layout-menu-bar"></vaadin-menu-bar></div>
      <div>Resize the splitter to show the overflow button</div>
    </vaadin-split-layout>

    <h2>Two menu bars</h2>

    <div style="display: flex">
      <vaadin-menu-bar id="two-bars-start" style="flex: 1 1 auto"></vaadin-menu-bar>
      <vaadin-menu-bar id="two-bars-end" style="flex: 1 1 auto" theme="end-aligned"></vaadin-menu-bar>
    </div>

    <script type="module">
      import '@vaadin/menu-bar';
      import '@vaadin/split-layout';
      import '@vaadin/tooltip';
      import '@vaadin/icon';
      import '@vaadin/vaadin-lumo-styles/vaadin-iconset.js';

      function makeComponent(text) {
        const item = document.createElement('vaadin-menu-bar-item');
        item.textContent = text;
        return item;
      }

      function makeIcon(img) {
        const item = document.createElement('vaadin-menu-bar-item');
        const icon = document.createElement('vaadin-icon');
        icon.setAttribute('icon', img);
        item.appendChild(icon);
        return item;
      }

      const menuBar = document.querySelector('vaadin-menu-bar');
      menuBar.items = [
        {
          text: 'View',
          tooltip: 'Options for how to view the content',
          children: [
            { text: 'Ruler', checked: false, tooltip: 'Show or hide the ruler' },
            { text: 'Status bar', checked: true, tooltip: 'Show or hide the status bar' },
          ],
        },
        { component: makeComponent('Edit') },
        {
          text: 'Share',
          children: [
            {
              text: 'On social media',
              tooltip: 'Share options',
              children: [{ text: 'Facebook' }, { text: 'Instagram' }],
            },
            { text: 'By email', tooltip: 'You cannot share by email', disabled: true },
            { component: 'hr' },
            { text: 'Get link' },
          ],
        },
        {
          text: 'Move',
          tooltip: 'Move to a different folder or trash.',
          children: [{ text: 'To folder' }, { text: 'To trash' }],
        },
        { text: 'Duplicate', tooltip: 'Create a duplicate' },
        {
          component: makeIcon('lumo:user'),
          children: [{ text: 'Archive' }, { text: 'Configure' }],
        },
      ];

      menuBar.addEventListener('item-selected', (e) => {
        const item = e.detail.value;
        if (item.checked != null) {
          item.checked = !item.checked;
        }
      });

      const simpleItems = (texts) => texts.map((text) => ({ text, children: [{ text: `${text} all` }] }));

      document.querySelector('#split-layout-menu-bar').items = simpleItems([
        'View',
        'Edit',
        'Share',
        'Move',
        'Duplicate',
        'Archive',
      ]);

      document.querySelector('#two-bars-start').items = simpleItems([
        'File',
        'Edit',
        'View',
        'Insert',
        'Format',
        'Tools',
        'Window',
        'Help',
      ]);
      document.querySelector('#two-bars-end').items = simpleItems(['Profile', 'Settings', 'Sign out']);
    </script>
  </body>
</html>
