<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Side Nav · Nested items and actions</title>
    <script type="module" src="./side-nav-single-wrapper.js"></script>
    <style>
      :root {
        font:
          100%/1.5 system-ui,
          sans-serif;
        color: #242b35;
        background: #f7f8fa;
        --accent: #244f9a;
        --focus: #215ac0;
        --vaadin-popover-background: white;
        --vaadin-popover-padding: 1rem;
      }

      body {
        margin: 0;
        padding: clamp(1rem, 5vw, 4rem);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 16rem) minmax(0, 1fr);
        max-width: 52rem;
        margin-inline: auto;
        background: white;
        border: 1px solid #dbe0e7;
        border-radius: 0.75rem;
      }

      vaadin-side-nav {
        display: grid;
        gap: 0.25rem;
        align-content: start;
        padding: 0.75rem;
        border-inline-end: 1px solid #dbe0e7;
      }

      main {
        padding: 1.5rem;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 1.5rem;
      }

      h2 {
        font-size: 1rem;
      }

      p {
        margin-block-start: 0.4rem;
      }

      .leading-toggle::part(toggle-button) {
        order: -1;
      }

      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }

      @media (max-width: 34rem) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
        }

        vaadin-side-nav {
          border-inline-end: 0;
          border-block-end: 1px solid #dbe0e7;
        }
      }
    </style>
  </head>
  <body>
    <div class="workspace">
      <vaadin-side-nav aria-label="Workspace">
        <vaadin-side-nav-item path="?view=home">
          <vaadin-icon slot="prefix" src="./assets/lucide-icons/home.svg" aria-hidden="true"></vaadin-icon>
          Home
        </vaadin-side-nav-item>
        <vaadin-side-nav-item button id="notifications">
          <vaadin-icon slot="prefix" src="./assets/lucide-icons/bell.svg" aria-hidden="true"></vaadin-icon>
          Notifications
        </vaadin-side-nav-item>
        <vaadin-side-nav-item path="?view=reports">
          <vaadin-icon slot="prefix" src="./assets/lucide-icons/chart-column-big.svg" aria-hidden="true"></vaadin-icon>
          Reports
          <button slot="actions" type="button" id="more-reports" aria-label="More actions for Reports">⋯</button>
        </vaadin-side-nav-item>
        <vaadin-side-nav-item path="?view=people" class="leading-toggle">
          <vaadin-icon slot="prefix" src="./assets/lucide-icons/users.svg" aria-hidden="true"></vaadin-icon>
          People
          <vaadin-side-nav-item slot="children" path="?view=directory">
            <vaadin-icon slot="prefix" src="./assets/lucide-icons/folder.svg" aria-hidden="true"></vaadin-icon>
            Directory
          </vaadin-side-nav-item>
          <vaadin-side-nav-item slot="children" path="?view=org-chart">
            <vaadin-icon slot="prefix" src="./assets/lucide-icons/layers.svg" aria-hidden="true"></vaadin-icon>
            Org Chart
          </vaadin-side-nav-item>
        </vaadin-side-nav-item>
        <vaadin-side-nav-item>
          <vaadin-icon slot="prefix" src="./assets/lucide-icons/cog.svg" aria-hidden="true"></vaadin-icon>
          Settings
          <vaadin-side-nav-item slot="children" path="?view=appearance">
            <vaadin-icon slot="prefix" src="./assets/lucide-icons/palette.svg" aria-hidden="true"></vaadin-icon>
            Appearance
          </vaadin-side-nav-item>
          <vaadin-side-nav-item slot="children" path="?view=preferences">
            <vaadin-icon slot="prefix" src="./assets/lucide-icons/list-todo.svg" aria-hidden="true"></vaadin-icon>
            Preferences
          </vaadin-side-nav-item>
        </vaadin-side-nav-item>
      </vaadin-side-nav>
      <main aria-live="polite">
        <h1></h1>
        <p></p>
      </main>
    </div>

    <vaadin-popover id="inbox" for="notifications" accessible-name="Notifications">
      <h2>Notifications</h2>
      <p>Your weekly report is ready.</p>
    </vaadin-popover>
    <vaadin-popover id="report-actions" for="more-reports" accessible-name="Report actions">
      <a href="?view=weekly">Open weekly report</a>
    </vaadin-popover>
  </body>
</html>
