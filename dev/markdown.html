      const markdown = document.querySelector('vaadin-markdown');

      lineBreaksToggle.addEventListener('change', () => {
        markdown.lineBreaks = lineBreaksToggle.checked;
      });

      markdown.content = `

## Introduction

Welcome to **Vaadin Adventures**, where *server-side logic* meets **frontend magic**.
This article exists to demonstrate **everything Markdown can do**—while Vaadin components cheer from the sidelines.

Vaadin lets you write **Java**, render **HTML**, and feel like a **frontend wizard** without touching JavaScript (unless you *want* to).
