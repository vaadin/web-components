<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combo Box Auto Select Mode</title>
    <script type="module" src="./common.js"></script>
    <style>
      section {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      output {
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <p>
      Type a filter (e.g. <code>gra</code>, <code>grape</code>, <code>ban</code>) and commit it with Tab, Enter, or an
      outside click. Items: apple, banana, grapefruit, grape.
    </p>

    <section>
      <vaadin-combo-box id="full-match" label="full-match (default)"></vaadin-combo-box>
      <output></output>
    </section>

    <section>
      <vaadin-combo-box id="first-match" label="first-match" auto-select-mode="first-match"></vaadin-combo-box>
      <output></output>
    </section>

    <section>
      <vaadin-combo-box id="only-match" label="only-match" auto-select-mode="only-match"></vaadin-combo-box>
      <output></output>
    </section>

    <section>
      <vaadin-combo-box
        id="custom-value"
        label="first-match + allow-custom-value"
        auto-select-mode="first-match"
        allow-custom-value
      ></vaadin-combo-box>
      <output></output>
    </section>

    <section>
      <vaadin-combo-box
        id="lazy"
        label="first-match + lazy countries"
        auto-select-mode="first-match"
      ></vaadin-combo-box>
      <output></output>
    </section>

    <section>
      <vaadin-multi-select-combo-box
        id="multi-first-match"
        label="multi-select first-match"
        auto-select-mode="first-match"
        style="width: 300px"
      ></vaadin-multi-select-combo-box>
      <output></output>
    </section>

    <section>
      <vaadin-multi-select-combo-box
        id="multi-only-match"
        label="multi-select only-match"
        auto-select-mode="only-match"
        style="width: 300px"
      ></vaadin-multi-select-combo-box>
      <output></output>
    </section>

    <script type="module">
      import '@vaadin/combo-box';
      import '@vaadin/multi-select-combo-box';

      const items = ['apple', 'banana', 'grapefruit', 'grape'];

      document.querySelectorAll('vaadin-combo-box').forEach((comboBox) => {
        if (comboBox.id !== 'lazy') {
          comboBox.items = items;
        }

        const output = comboBox.parentElement.querySelector('output');
        comboBox.addEventListener('change', () => {
          output.textContent = `value: ${JSON.stringify(comboBox.value)}`;
        });
      });

      document.querySelectorAll('vaadin-multi-select-combo-box').forEach((comboBox) => {
        comboBox.items = items;

        const output = comboBox.parentElement.querySelector('output');
        comboBox.addEventListener('selected-items-changed', () => {
          output.textContent = `selectedItems: ${JSON.stringify(comboBox.selectedItems)}`;
        });
      });

      // Lazy data provider with emulated network latency, for testing
      // the deferred commit when blurring before data is loaded.
      document.querySelector('#lazy').dataProvider = async (params, callback) => {
        const index = params.page * params.pageSize;
        const response = await fetch(
          `https://demo.vaadin.com/demo-data/1.0/filtered-countries?index=${index}&count=${params.pageSize}&filter=${params.filter}`,
        );
        if (response.ok) {
          const { result, size } = await response.json();
          setTimeout(() => {
            callback(result, size);
          }, 500);
        }
      };
    </script>
  </body>
</html>
