<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer</title>
    <script type="module" src="./common.js"></script>
    <script>
      window.Vaadin = window.Vaadin || {};
      window.Vaadin.featureFlags = window.Vaadin.featureFlags || {};
      window.Vaadin.featureFlags.pdfViewerComponent = true;
    </script>
    <script type="module">
      import '@vaadin/button';
      import '@vaadin/pdf-viewer';
      import '@vaadin/tooltip';

      const viewer = document.querySelector('vaadin-pdf-viewer');
      const select = document.querySelector('#src');
      const assets = document.querySelector('#assets');
      const pageInput = document.querySelector('#page');
      const headerVisible = document.querySelector('#header-visible');
      const headerTitle = document.querySelector('#header-title');
      const collapsed = document.querySelector('#collapsed');
      const downloadHidden = document.querySelector('#download-hidden');
      const printHidden = document.querySelector('#print-hidden');
      const findHidden = document.querySelector('#find-hidden');
      const sidebarOpened = document.querySelector('#sidebar-opened');
      const findText = document.querySelector('#find-text');
      const highlightPage = document.querySelector('#highlight-page');
      const log = document.querySelector('#log');

      const update = () => {
        viewer.assetsUrl = assets.checked ? '/node_modules/pdfjs-dist/' : null;
        viewer.src = select.value;
      };
      select.addEventListener('change', update);
      assets.addEventListener('change', update);
      pageInput.addEventListener('change', () => {
        viewer.page = pageInput.valueAsNumber;
      });

      viewer.addEventListener('page-changed', (e) => {
        pageInput.value = e.detail.value;
      });
      viewer.addEventListener('page-count-changed', (e) => {
        pageInput.max = e.detail.value;
      });

      headerVisible.addEventListener('change', () => {
        viewer.headerVisible = headerVisible.checked;
      });
      headerTitle.addEventListener('change', () => {
        viewer.headerTitle = headerTitle.value;
      });
      collapsed.addEventListener('change', () => {
        viewer.toolbarCollapsed = collapsed.checked;
      });
      viewer.addEventListener('toolbar-collapsed-changed', (e) => {
        collapsed.checked = e.detail.value;
      });
      downloadHidden.addEventListener('change', () => {
        viewer.downloadButtonHidden = downloadHidden.checked;
      });
      document.querySelector('#download').addEventListener('click', () => {
        viewer.download();
      });
      printHidden.addEventListener('change', () => {
        viewer.printButtonHidden = printHidden.checked;
      });
      document.querySelector('#print').addEventListener('click', async () => {
        log.textContent = 'print() called';
        await viewer.print();
        log.textContent = 'print() resolved';
      });
      findHidden.addEventListener('change', () => {
        viewer.findButtonHidden = findHidden.checked;
      });
      document.querySelector('#find').addEventListener('click', () => {
        viewer.find(findText.value);
      });
      document.querySelector('#highlight').addEventListener('click', () => {
        viewer.highlight(highlightPage.valueAsNumber, findText.value);
      });
      sidebarOpened.addEventListener('change', () => {
        viewer.sidebarOpened = sidebarOpened.checked;
      });
      viewer.addEventListener('sidebar-opened-changed', (e) => {
        sidebarOpened.checked = e.detail.value;
        log.textContent = `sidebar-opened-changed: ${e.detail.value}`;
      });
      viewer.addEventListener('find-result', (e) => {
        log.textContent = `find-result: ${JSON.stringify(e.detail)}`;
      });
      viewer.addEventListener('zoom-changed', (e) => {
        log.textContent = `zoom-changed: ${e.detail.value}`;
      });

      document.querySelector('#approve').addEventListener('click', () => {
        log.textContent = 'Approve clicked';
      });

      viewer.addEventListener('document-load', (e) => {
        log.textContent = `document-load: ${JSON.stringify(e.detail)}`;
      });
      viewer.addEventListener('document-error', (e) => {
        log.textContent = `document-error: ${e.detail.reason}`;
      });

      update();
    </script>
    <style>
      vaadin-pdf-viewer {
        height: 600px;
      }
    </style>
  </head>

  <body>
    <p>
      <label>
        Document
        <select id="src">
          <option value="/dev/assets/pdf/01_fonts.pdf">01_fonts.pdf</option>
          <option value="/dev/assets/pdf/02_images_and_vector_graphics.pdf">02_images_and_vector_graphics.pdf</option>
          <option value="/dev/assets/pdf/03_form_with_signatures.pdf">03_form_with_signatures.pdf</option>
          <option value="/dev/assets/pdf/04_optional_content_help_layer.pdf">04_optional_content_help_layer.pdf</option>
          <option value="/dev/assets/pdf/05_tagged_accessible_pdf_ua.pdf">05_tagged_accessible_pdf_ua.pdf</option>
          <option value="/packages/pdf-viewer/test/fixtures/encrypted.pdf">Password-protected file</option>
          <option value="/packages/pdf-viewer/test/fixtures/invalid.pdf">Invalid file</option>
          <option value="/does-not-exist.pdf">Missing file</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="assets" checked />
        Set assetsUrl
      </label>
      <label>
        Page
        <input type="number" id="page" min="1" value="1" />
      </label>
      <label>
        <input type="checkbox" id="header-visible" />
        Show header
      </label>
      <label>
        Header title
        <input type="text" id="header-title" />
      </label>
      <label>
        <input type="checkbox" id="collapsed" />
        Collapse toolbar
      </label>
      <label>
        <input type="checkbox" id="download-hidden" />
        Hide download button
      </label>
      <button id="download">download()</button>
      <label>
        <input type="checkbox" id="print-hidden" />
        Hide print button
      </label>
      <button id="print">print()</button>
      <label>
        <input type="checkbox" id="find-hidden" />
        Hide find button
      </label>
      <label>
        Text
        <input type="text" id="find-text" value="table" />
      </label>
      <button id="find">find(text)</button>
      <label>
        Page
        <input type="number" id="highlight-page" min="1" value="2" />
      </label>
      <button id="highlight">highlight(page, text)</button>
      <label>
        <input type="checkbox" id="sidebar-opened" />
        Open sidebar
      </label>
      <output id="log"></output>
    </p>
    <vaadin-pdf-viewer>
      <vaadin-button slot="toolbar-actions" id="approve" theme="tertiary">
        Approve
        <vaadin-tooltip slot="tooltip" text="Approve the document"></vaadin-tooltip>
      </vaadin-button>
    </vaadin-pdf-viewer>
  </body>
</html>
