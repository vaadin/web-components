<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer</title>
    <script type="module" src="./common.js"></script>
    <script>
      window.Vaadin = window.Vaadin || {};
      window.Vaadin.featureFlags = window.Vaadin.featureFlags || {};
      window.Vaadin.featureFlags.pdfViewerComponent = true;
    </script>
    <script type="module">
      import '@vaadin/button';
      import '@vaadin/pdf-viewer';
      import '@vaadin/radio-group';
      import '@vaadin/select';
      import '@vaadin/tooltip';

      const viewer = document.querySelector('vaadin-pdf-viewer');
      const select = document.querySelector('#src');
      const fileInput = document.querySelector('#file');
      const log = document.querySelector('#log');

      select.items = [
        { label: '01_fonts.pdf', value: '/dev/assets/pdf/01_fonts.pdf' },
        { label: '02_images_and_vector_graphics.pdf', value: '/dev/assets/pdf/02_images_and_vector_graphics.pdf' },
        { label: '03_form_with_signatures.pdf', value: '/dev/assets/pdf/03_form_with_signatures.pdf' },
        { label: '04_optional_content_help_layer.pdf', value: '/dev/assets/pdf/04_optional_content_help_layer.pdf' },
        { label: '05_tagged_accessible_pdf_ua.pdf', value: '/dev/assets/pdf/05_tagged_accessible_pdf_ua.pdf' },
        { label: '06_mixed_page_sizes.pdf', value: '/dev/assets/pdf/06_mixed_page_sizes.pdf' },
        { label: 'Password-protected file', value: '/packages/pdf-viewer/test/fixtures/encrypted.pdf' },
        { label: 'Invalid file', value: '/packages/pdf-viewer/test/fixtures/invalid.pdf' },
        { label: 'Missing file', value: '/does-not-exist.pdf' },
      ];
      select.value = select.items[0].value;

      let fileUrl = null;
      const revokeFileUrl = () => {
        if (fileUrl) {
          URL.revokeObjectURL(fileUrl);
          fileUrl = null;
        }
      };

      const update = () => {
        revokeFileUrl();
        fileInput.value = '';
        viewer.src = select.value;
      };
      select.addEventListener('change', update);

      fileInput.addEventListener('change', () => {
        const [file] = fileInput.files;
        if (!file) {
          return;
        }
        revokeFileUrl();
        fileUrl = URL.createObjectURL(file);
        select.value = '';
        viewer.src = fileUrl;
      });

      document.querySelector('#direction').addEventListener('value-changed', (e) => {
        viewer.setAttribute('dir', e.detail.value);
      });

      document.querySelector('#approve').addEventListener('click', () => {
        log.textContent = 'Approve clicked';
      });

      viewer.addEventListener('document-load', (e) => {
        log.textContent = `document-load: ${JSON.stringify(e.detail)}`;
      });
      viewer.addEventListener('document-error', (e) => {
        log.textContent = `document-error: ${e.detail.reason}`;
      });

      update();
    </script>
    <style>
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 2rem;
        margin-bottom: 2rem;
        font-size: 0.875rem;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        align-items: start;
        gap: 0.5em;
      }

      .control-group.document,
      .control-group.log {
        grid-column: span 2;
      }

      #src {
        width: 100%;
      }

      vaadin-pdf-viewer {
        height: 600px;
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <div class="control-group document">
        <vaadin-select id="src" label="Document" placeholder="Local file"></vaadin-select>
        <label>
          Local file
          <input type="file" id="file" accept="application/pdf,.pdf" />
        </label>
      </div>
      <div class="control-group">
        <vaadin-radio-group id="direction" label="Direction">
          <vaadin-radio-button label="LTR" value="ltr" checked></vaadin-radio-button>
          <vaadin-radio-button label="RTL" value="rtl"></vaadin-radio-button>
        </vaadin-radio-group>
      </div>
      <div class="control-group log">
        <span>Last event</span>
        <output id="log"></output>
      </div>
    </div>
    <vaadin-pdf-viewer>
      <vaadin-button slot="toolbar-actions" id="approve" theme="tertiary">
        Approve
        <vaadin-tooltip slot="tooltip" text="Approve the document"></vaadin-tooltip>
      </vaadin-button>
    </vaadin-pdf-viewer>
  </body>
</html>
