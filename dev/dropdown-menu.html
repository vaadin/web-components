<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dropdown menu</title>
    <script type="module" src="./common.js"></script>
    <script type="module">
      window.Vaadin ??= {};
      window.Vaadin.featureFlags ??= {};
      window.Vaadin.featureFlags.dropdownMenuComponent = true;

      import '@vaadin/dropdown-menu';
      import '@vaadin/icon';
      import '@vaadin/icons';

      const items = [
        { text: 'Edit' },
        {
          text: 'Share',
          children: [{ text: 'By email' }, { text: 'By link', children: [{ text: 'Copy link' }, { text: 'Open link' }] }],
        },
        { text: 'Show details', checked: true, keepOpen: true },
        { component: 'hr' },
        { text: 'Archive', disabled: true },
        { text: 'Delete' },
      ];

      document.querySelectorAll('vaadin-dropdown-menu').forEach((menu) => {
        if (!menu.querySelector('[slot="overlay"]')) {
          menu.items = items;
        }

        menu.addEventListener('item-selected', (e) => {
          const { value } = e.detail;
          const text = value instanceof HTMLElement ? value.textContent : value.text;
          console.log('item-selected', text);

          if (value.keepOpen) {
            value.checked = !value.checked;
            menu.items = [...menu.items];
          }
        });
      });
    </script>
  </head>

  <body>
    <section class="section">
      <h2 class="heading">Items</h2>
      <vaadin-dropdown-menu label="Actions"></vaadin-dropdown-menu>
    </section>

    <section class="section">
      <h2 class="heading">Slotted list-box</h2>
      <vaadin-dropdown-menu label="Actions">
        <vaadin-context-menu-list-box slot="overlay">
          <vaadin-context-menu-item>Edit</vaadin-context-menu-item>
          <vaadin-context-menu-item>Duplicate</vaadin-context-menu-item>
          <hr />
          <vaadin-context-menu-item disabled>Archive</vaadin-context-menu-item>
          <vaadin-context-menu-item>Delete</vaadin-context-menu-item>
        </vaadin-context-menu-list-box>
      </vaadin-dropdown-menu>
    </section>

    <section class="section">
      <h2 class="heading">Icon only</h2>
      <vaadin-dropdown-menu>
        <vaadin-dropdown-menu-button slot="button" aria-label="More actions">
          <vaadin-icon icon="vaadin:ellipsis-dots-v"></vaadin-icon>
        </vaadin-dropdown-menu-button>
      </vaadin-dropdown-menu>
    </section>

    <section class="section">
      <h2 class="heading">Custom button with prefix</h2>
      <vaadin-dropdown-menu>
        <vaadin-dropdown-menu-button slot="button">
          <vaadin-icon icon="vaadin:cog" slot="prefix"></vaadin-icon>
          Settings
        </vaadin-dropdown-menu-button>
      </vaadin-dropdown-menu>
    </section>

    <section class="section">
      <h2 class="heading">Disabled</h2>
      <vaadin-dropdown-menu label="Actions" disabled></vaadin-dropdown-menu>
    </section>

    <section class="section">
      <h2 class="heading">Position bottom-end</h2>
      <vaadin-dropdown-menu label="Actions" position="bottom-end"></vaadin-dropdown-menu>
    </section>

    <section class="section">
      <h2 class="heading">Primary theme</h2>
      <vaadin-dropdown-menu label="Actions" theme="primary"></vaadin-dropdown-menu>
    </section>

    <section class="section">
      <h2 class="heading">Overlay width</h2>
      <vaadin-dropdown-menu
        label="Actions"
        style="--vaadin-dropdown-menu-overlay-width: 300px"
      ></vaadin-dropdown-menu>
    </section>
  </body>
</html>
