<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages</title>
    <script type="module" src="../common.js"></script>

    <script type="module">
      import '@vaadin/button';
      import '@vaadin/checkbox-group';
      import '@vaadin/icon';
      import '@vaadin/icons';
      import '@vaadin/message-input';
      import '@vaadin/message-list';
      import '@vaadin/upload/src/vaadin-upload-button.js';
      import '@vaadin/upload/vaadin-upload-drop-zone.js';
      import '@vaadin/upload/vaadin-upload-file-list.js';
      import { xhrCreator } from '@vaadin/upload/test/helpers.js';
      import { UploadManager } from '@vaadin/upload/vaadin-upload-manager.js';

      const list = document.querySelector('vaadin-message-list');

      list.items = [
        {
          text: 'Are we still on for the design review this afternoon?',
          time: '9:41 AM',
          userName: 'Nora',
          userColorIndex: 2,
        },
        {
          text: 'Yes. I added the latest screenshots to the project folder.',
          time: '9:43 AM',
          userName: 'Maya',
          userColorIndex: 0,
          theme: 'self',
        },
        {
          text: 'I also left comments on the empty and loading states.',
          time: '9:44 AM',
          userName: 'Nora',
          userColorIndex: 2,
          attachments: [{ name: 'review-notes.pdf', type: 'application/pdf', url: '#review-notes.pdf' }],
        },
        {
          text: 'The review starts in 15 minutes.',
          time: '9:45 AM',
          userName: 'Assistant',
          userColorIndex: 4,
          theme: 'full-width',
        },
      ];

      document.querySelector('#list-variants').addEventListener('change', (event) => {
        const theme = event.currentTarget.value.join(' ');
        list.setAttribute('theme', theme);
      });

      const messageInput = document.querySelector('vaadin-message-input');
      messageInput.addEventListener('submit', (event) => {
        // Convert uploaded files to message attachments
        const attachments = manager.files
          .filter((file) => file.complete)
          .map((file) => ({
            name: file.name,
            url: file.type?.startsWith('image/') ? URL.createObjectURL(file) : `#${file.name}`,
            type: file.type,
          }));

        list.items = [
          ...list.items,
          {
            text: event.detail.value,
            time: 'Now',
            userName: 'Maya',
            userColorIndex: 0,
            theme: 'self',
            attachments,
          },
        ];

        // Clear uploaded files
        manager.files = [];
      });

      // Create the manager
      const manager = new UploadManager({
        target: '/api/upload',
      });
      // Use mock XHR
      manager._createXhr = xhrCreator({ size: 512, uploadTime: 3000, stepTime: 500 });

      // Link components to manager
      document.querySelectorAll('vaadin-upload-file-list, vaadin-upload-button, vaadin-upload-drop-zone').forEach((el) => {
        el.manager = manager;
      });

      document.querySelectorAll('.prompt-button').forEach((button) => {
        button.addEventListener('click', () => {
          messageInput.value = button.dataset.prompt;
        });
      });
    </script>

    <style>
      .preview {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        width: min(48rem, 100%);
        height: 32rem;
        border: 1px solid var(--vaadin-border-color-secondary);
        border-radius: var(--vaadin-radius-m);
        overflow: hidden;
      }

      vaadin-message-input {
        margin: var(--vaadin-padding-m);
      }
    </style>
  </head>

  <body>
    <section class="section">
      <vaadin-checkbox-group id="list-variants" label="Theme Variants">
        <vaadin-checkbox label="Bubble" value="bubble"></vaadin-checkbox>
        <vaadin-checkbox label="One to one" value="one-to-one"></vaadin-checkbox>
      </vaadin-checkbox-group>
    </section>

    <section class="section">
      <vaadin-upload-drop-zone>
        <div class="preview">
          <vaadin-message-list announce-messages></vaadin-message-list>
          <vaadin-message-input>
            <vaadin-upload-file-list class="upload" theme="thumbnails" slot="header"></vaadin-upload-file-list>
            <vaadin-upload-button class="upload" theme="icon tertiary" slot="prefix">
              <vaadin-icon icon="vaadin:paperclip"></vaadin-icon>
              <vaadin-tooltip slot="tooltip" text="Add files"></vaadin-tooltip>
            </vaadin-upload-button>
            <div slot="footer" class="prompt-buttons">
              <vaadin-button class="prompt-button" theme="small tertiary"
                data-prompt="Summarize the attached documents in five concise bullet points.">
                Summarize documents
              </vaadin-button>
              <vaadin-button class="prompt-button" theme="small tertiary"
                data-prompt="Identify the three biggest risks in this material and explain why they matter.">
                List key risks
              </vaadin-button>
              <vaadin-button class="prompt-button" theme="small tertiary"
                data-prompt="Draft a short follow-up email based on these findings.">
                Draft follow-up
              </vaadin-button>
            </div>
          </vaadin-message-input>
        </div>
      </vaadin-upload-drop-zone>
    </section>
  </body>
</html>
